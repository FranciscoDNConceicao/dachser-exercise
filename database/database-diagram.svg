<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><rect width="1920" height="1080" fill="#FFFFFF"/><text x="150" y="98" font-size="44" font-weight="700" fill="#1B2733">Database Model — Profit Calculation</text><text x="150" y="140" font-size="21" fill="#5B6B7B">4 tables · 3 foreign keys · H2 in-memory database · schema in database/schema.sql</text><path d="M817 406 V520" stroke="#4A5A6A" stroke-width="2.5" fill="none"/><path d="M807 416 L827 416 M807 424 L827 424" stroke="#4A5A6A" stroke-width="2.5" fill="none"/><path d="M817 502 L806 520 M817 502 L817 520 M817 502 L828 520" stroke="#4A5A6A" stroke-width="2.5" fill="none"/><circle cx="817" cy="492" r="6" fill="#FFFFFF" stroke="#4A5A6A" stroke-width="2.5"/><text x="829" y="466" font-size="15" font-style="italic" fill="#5B6B7B" text-anchor="start">is calculated in</text><path d="M630 598 H720" stroke="#4A5A6A" stroke-width="2.5" fill="none"/><path d="M702 588 L702 608 M710 588 L710 608" stroke="#4A5A6A" stroke-width="2.5" fill="none"/><path d="M648 598 L630 587 M648 598 L630 598 M648 598 L630 609" stroke="#4A5A6A" stroke-width="2.5" fill="none"/><circle cx="658" cy="598" r="6" fill="#FFFFFF" stroke="#4A5A6A" stroke-width="2.5"/><text x="680" y="582" font-size="15" font-style="italic" fill="#5B6B7B" text-anchor="middle">owns</text><path d="M1200 598 H1290" stroke="#4A5A6A" stroke-width="2.5" fill="none"/><path d="M1210 588 L1210 608 M1218 588 L1218 608" stroke="#4A5A6A" stroke-width="2.5" fill="none"/><path d="M1272 598 L1290 587 M1272 598 L1290 598 M1272 598 L1290 609" stroke="#4A5A6A" stroke-width="2.5" fill="none"/><circle cx="1262" cy="598" r="6" fill="#FFFFFF" stroke="#4A5A6A" stroke-width="2.5"/><text x="1240" y="582" font-size="15" font-style="italic" fill="#5B6B7B" text-anchor="middle">owns</text><g><rect x="438" y="195" width="480" height="216" rx="10" fill="#0B1A2A" opacity="0.08"/><rect x="435" y="190" widt