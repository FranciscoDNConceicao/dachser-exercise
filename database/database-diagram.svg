size="13" font-weight="700" fill="#1B2733" text-anchor="middle">PK</text><text x="788" y="602" font-size="18" fill="#1B2733" font-weight="700">id</text><text x="1182" y="602" font-size="16" fill="#5B6B7B" text-anchor="end" font-family="Consolas, 'Courier New', monospace">BIGINT</text><rect x="720.75" y="616" width="478.5" height="40" fill="#F5F7FA"/><rect x="736" y="625" width="38" height="22" rx="4" fill="#7A93AC"/><text x="755" y="641" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">FK</text><text x="788" y="642" font-size="18" fill="#1B2733" font-weight="400">shipment_id</text><text x="1182" y="642" font-size="16" fill="#5B6B7B" text-anchor="end" font-family="Consolas, 'Courier New', monospace">BIGINT</text><text x="788" y="682" font-size="18" fill="#1B2733" font-weight="400">total_income</text><text x="1182" y="682" font-size="16" fill="#5B6B7B" text-anchor="end" font-family="Consolas, 'Courier New', monospace">DECIMAL(12,2)</text><rect x="720.75" y="696" width="478.5" height="40" fill="#F5F7FA"/><text x="788" y="722" font-size="18" fill="#1B2733" font-weight="400">total_costs</text><text x="1182" y="722" font-size="16" fill="#5B6B7B" text-anchor="end" font-family="Consolas, 'Courier New', monospace">DECIMAL(12,2)</text><text x="788" y="762" font-size="18" fill="#1B2733" font-weight="400">profit_or_loss</text><text x="1182" y="762" font-size="16" fill="#5B6B7B" text-anchor="end" font-family="Consolas, 'Courier New', monospace">DECIMAL(12,2)</text><path d="M720.75 776 H1199.25 V806 a9.25 9.25 0 0 1 -9.25 9.25 H730 a9.25 9.25 0 0 1 -9.25 -9.25 Z" fill="#F5F7FA"/><text x="788" y="802" font-size="18" fill="#1B2733" font-weight="400">calculated_at</text><text x="1182" y="802" font-size="16" fill="#5B6B7B" text-anchor="end" font-family="Consolas, 'Courier New', monospace">TIMESTAMP</text></g><g><rect x="1293" y="525" width="480" height="216" rx="10" fill="#0B1A2A" opacity="0.08"/><rect x="1290" y="520" width="480" height="216" rx="10" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="1.5"/><path d="M1290 576 V530 a10 10 0 0 1 10 -10 H1760 a10 10 0 0 1 10 10 V576 Z" fill="#B5483B"/><text x="1310" y="556" font-size="23" font-weight="700" fill="#FFFFFF">costs</text><rect x="1306" y="585" width="38" height="22" rx="4" fill="#E8B931"/><text x="1325" y="601" font-size="13" font-weight="700" fill="#1B2733" text-anchor="middle">PK</text><text x="1358" y="602" font-size="18" fill="#1B2733" font-weight="700">id</text><text x="1752" y="602" font-size="16" fill="#5B6B7B" text-anchor="end" font-family="Consolas, 'Courier New', monospace">BIGINT</text><rect x="1290.75" y="616" width="478.5" height="40" fill="#F5F7FA"/><rect x="1306" y="625" width="38" height="22" rx="4" fill="#7A93AC"/><text x="1325" y="641" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">FK</text><text x="1358" y="642" font-size="18" fill="#1B2733" font-weight="400">calculation_id</text><text x="1752" y="642" font-size="16" fill="#5B6B7B" text-anchor="end" font-family="Consolas, 'Courier New', monospace">BIGINT</text><text x="1358" y="682" font-size="18" fill="#1B2733" font-weight="400">description</text><text x="1752" y="682" font-size="16" fill="#5B6B7B" text-anchor="end" font-family="Consolas, 'Courier New', monospace">VARCHAR(255)</text><path d="M1290.75 696 H1769.25 V726 a9.25 9.25 0 0 1 -9.25 9.25 H1300 a9.25 9.25 0 0 1 -9.25 -9.25 Z" fill="#F5F7FA"/><text x="1358" y="722" font-size="18" fill="#1B2733" font-weight="400">amount</text><text x="1752" y="722" font-size="16" fill="#5B6B7B" text-anchor="end" font-family="Consolas, 'Courier New', monospace">DECIMAL(12,2)</text></g><rect x="1005" y="190" width="480" height="216" rx="10" fill="#F3F6FA" stroke="#D5DCE4" stroke-width="1.5"/><text x="1029" y="230" font-size="20" font-weight="700" fill="#1B2733">Rules enforced by the database</text><circle cx="1035" cy="262" r="4" fill="#4A5A6A"/><text x="1051" y="268" font-size="17" fill="#1B2733">Each calculation owns its income and costs</text><circle cx="1035" cy="292" r="4" fill="#4A5A6A"/><text x="1051" y="298" font-size="17" fill="#1B2733">Deleting a calculation <tspan font-weight="700">cascades</tspan> to its entries</text><circle cx="1035" cy="322" r="4" fill="#4A5A6A"/><text x="1051" y="328" font-size="17" fill="#1B2733">Income / cost <tspan font-weight="700">amount ≥ 0</tspan> (CHECK)</text><circle cx="1035" cy="352" r="4" fill="#4A5A6A"/><text x="1051" y="358" font-size="17" fill="#1B2733">profit_or_loss = total_income − total_costs</text><circle cx="1035" cy="382" r="4" fill="#4A5A6A"/><text x="1051" y="388" font-size="17" fill="#1B2733">Indexes on every FK + (shipment_id, calculated_at)</text><rect x="150" y="979" width="38" height="22" rx="4" fill="#E8B931"/><text x="169" y="995" font-size="13" font-weight="700" fill="#1B2733" text-anchor="middle">PK</text><text x="200" y="996" font-size="17" fill="#5B6B7B">Primary key</text><rect x="340" y="979" width="38" height="22" rx="4" fill="#7A93AC"/><text x="359" y="995" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">FK</text><text x="390" y="996" font-size="17" fill="#5B6B7B">Foreign key</text><rect x="530" y="979" width="38" height="22" rx="4" fill="#3C9D9B"/><text x="549" y="995" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">UQ</text><text x="580" y="996" font-size="17" fill="#5B6B7B">Unique</text><path d="M720 990 H766" stroke="#4A5A6A" stroke-width="2.5" fill="none"/><path d="M730 980 L730 1000 M738 980 L738 1000" stroke="#4A5A6A" stroke-width="2.5" fill="none"/><text x="780" y="996" font-size="17" fill="#5B6B7B">Exactly one</text><path d="M920 990 H966" stroke="#4A5A6A" stroke-width="2.5" fill="none"/><path d="M948 990 L966 1001 M948 990 L966 990 M948 990 L966 979" stroke="#4A5A6A" stroke-width="2.5" fill="none"/><circle cx="938" cy="990" r="6" fill="#FFFFFF" stroke="#4A5A6A" stroke-width="2.5"/><text x="980" y="996" font-size="17" fill="#5B6B7B">Zero or many</text><text x="1140" y="996" font-size="17" fill="#5B6B7B">All columns are NOT NULL unless marked <tspan font-style="italic">optional</tspan></text></svg>