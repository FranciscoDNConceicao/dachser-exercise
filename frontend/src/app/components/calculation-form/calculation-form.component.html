<form [formGroup]="form" (ngSubmit)="submit()" class="border rounded p-3">
  <div class="row g-3 align-items-start">
    <fieldset class="col-md-4">
      <legend class="fs-6 text-muted">Income &amp; Outcome</legend>
      <mat-form-field class="w-100">
        <mat-label>Income</mat-label>
        <input matInput type="number" min="0" step="0.01" formControlName="income">
        @if (form.controls.income.hasError('min')) {
          <mat-error>Must be 0 or more</mat-error>
        }
      </mat-form-field>
    </fieldset>

    <fieldset class="col-md-5">
      <legend class="fs-6 text-muted">Costs</legend>
      <mat-form-field class="w-100">
        <mat-label>Cost</mat-label>
        <input matInput type="number" min="0" step="0.01" formControlName="cost">
        @if (form.controls.cost.hasError('min')) {
          <mat-error>Must be 0 or more</mat-error>
        }
      </mat-form-field>
      <mat-form-field class="w-100">
        <mat-label>Additional Cost</mat-label>
        <input matInput type="number" min="0" step="0.01" formControlName="additionalCost">
        @if (form.controls.additionalCost.hasError('min')) {
          <mat-error>Must be 0 or more</mat-error>
        }
      </mat-form-field>
    </fieldset>

    <div class="col-md-3 d-flex align-items-end justify-content-end h-100 pt-md-5">
      <button mat-flat-button color="primary" type="submit" [disabled]="disabled">Calculate</button>
    </div>
  </div>
</form>
