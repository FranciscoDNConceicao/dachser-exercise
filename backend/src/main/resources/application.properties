spring.application.name=backend
server.port=8000

# In-memory H2 database (recreated on every startup)
spring.datasource.url=jdbc:h2:mem:profitdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Tables from schema.sql and sample data from data.sql; Hibernate only validates the entities against them
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Angular dev server allowed to call the API
app.cors.allowed-origin=http://localhost:4200

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console