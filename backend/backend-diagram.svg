" y="586" font-size="16" fill="#5B6B7B" font-style="italic" xml:space="preserve">  profit = income − costs, then save</text><text x="878" y="616" font-size="15" fill="#1B2733" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">findHistory(shipmentId)</text><text x="878" y="646" font-size="16" fill="#5B6B7B" font-style="italic" xml:space="preserve">  most recent first</text><rect x="863" y="699" width="400" height="194" rx="10" fill="#0B1A2A" opacity="0.08"/><rect x="860" y="694" width="400" height="194" rx="10" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="1.5"/><path d="M860 744 V704 a10 10 0 0 1 10 -10 H1250 a10 10 0 0 1 10 10 V744 Z" fill="#3C7D7B"/><text x="878" y="726.56" font-size="21" font-weight="700" fill="#FFFFFF">Mappers &amp; DTOs</text><text x="1244" y="724" font-size="14" fill="#FFFFFF" opacity="0.85" text-anchor="end" font-family="Consolas, 'Courier New', monospace">records</text><text x="878" y="778" font-size="15" fill="#1B2733" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ShipmentMapper</text><text x="878" y="808" font-size="15" fill="#1B2733" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ProfitCalculationMapper</text><text x="878" y="838" font-size="15" fill="#5B6B7B" font-style="italic" xml:space="preserve">In:  ProfitCalculationRequest (validated)</text><text x="878" y="868" font-size="14" fill="#5B6B7B" font-style="italic" xml:space="preserve">Out: ShipmentResponse, ProfitCalculationResponse</text><rect x="1303" y="255" width="360" height="134" rx="10" fill="#0B1A2A" opacity="0.08"/><rect x="1300" y="250" width="360" height="134" rx="10" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="1.5"/><path d="M1300 300 V260 a10 10 0 0 1 10 -10 H1650 a10 10 0 0 1 10 10 V300 Z" fill="#2F5D8C"/><text x="1318" y="282.56" font-size="21" font-weight="700" fill="#FFFFFF">ShipmentRepository</text><text x="1644" y="280" font-size="14" fill="#FFFFFF" opacity="0.85" text-anchor="end" font-family="Con